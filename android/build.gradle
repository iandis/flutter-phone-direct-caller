group 'com.yanisalfian.flutterphonedirectcaller'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.4.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Kotlin isn't applied here: Flutter applies kotlin-android to plugins that don't (AGP 8, or AGP 9 with
// android.builtInKotlin=false), and AGP 9's built-in Kotlin compiles the sources otherwise.
apply plugin: 'com.android.library'

android {
    namespace "com.yanisalfian.flutterphonedirectcaller"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 24
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
